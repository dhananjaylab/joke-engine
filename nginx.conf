server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Proxy API to uvicorn
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;        # long timeout for SSE streams
        proxy_buffering    off;         # disable buffering for SSE
    }

    # WebSocket upgrade
    location /ws/ {
        proxy_pass            http://api:8000;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade    $http_upgrade;
        proxy_set_header      Connection "Upgrade";
        proxy_read_timeout    3600s;
    }

    # Media files (TTS audio, card PNGs)
    location /media/ {
        proxy_pass http://api:8000;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — send all other routes to index.html
    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
        expires    -1;
    }

    # Cache Vite hashed assets
    location ~* \.(js|css|woff2|png|svg)$ {
        root    /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
